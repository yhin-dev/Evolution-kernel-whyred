name: Build Evolution-Kernel Whyred (4.19)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 python-is-python3 unzip wget zip zstd

      - name: Clone Kernel Source (user-why-red 4.19)
        run: |
          GH="https://github.com"
          git clone --depth=1 -b back "$GH/user-why-red/android_kernel_xiaomi_sdm660_419.git" kernel

      - name: Download Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          GH="https://github.com"
          git clone --depth=1 "$GH/Neutron-Toolchains/antman.git" .
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc

      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          GH="https://github.com"
          git clone --depth=1 "$GH/KernelSU-Next/KernelSU-Next.git" KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh

      - name: Integrate NoMount
        working-directory: kernel
        run: |
          GH="https://github.com"
          git clone --depth=1 "$GH/maxsteeel/nomount.git" nomount_repo
          if [ -f "nomount_repo/kernel/setup.sh" ]; then
            bash nomount_repo/kernel/setup.sh
          elif [ -f "nomount_repo/setup.sh" ]; then
            bash nomount_repo/setup.sh
          else
            mkdir -p fs/nomount
            cp -r nomount_repo/kernel/src/* fs/nomount/ 2>/dev/null || cp -r nomount_repo/src/* fs/nomount/
            grep -q "nomount" fs/Kconfig || sed -i '/endmenu/i source "fs/nomount/Kconfig"' fs/Kconfig
            grep -q "nomount" fs/Makefile || echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
          fi
          rm -rf nomount_repo

      - name: Integrate SuSFS (4.19) & Fix Rejects
        working-directory: kernel
        run: |
          GL="https://gitlab.com"
          git clone --depth=1 -b kernel-4.19 "$GL/simonpunk/susfs4ksu.git" susfs_repo
          cp -r susfs_repo/kernel_patches/fs/* fs/
          cp -r susfs_repo/kernel_patches/include/linux/* include/linux/
          patch -p1 --forward -F 5 < susfs_repo/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

          python3 - << 'EOF'
          import re
          with open("fs/namespace.c", "r") as f:
              code = f.read()

          def repl_vfs(m):
              arg = m.group(1).strip()
              return f"""#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (unlikely(susfs_is_current_ksu_domain())) {{
          \t\tmnt = alloc_vfsmnt({arg}, true, 0);
          \t\tgoto bypass_orig_flow;
          \t}}
          \tmnt = alloc_vfsmnt({arg}, false, 0);
          bypass_orig_flow:
          #else
          \tmnt = alloc_vfsmnt({arg});
          #endif"""

          new_clone = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tbool is_current_ksu_domain = susfs_is_current_ksu_domain();
          \tbool is_current_zygote_domain = susfs_is_current_zygote_domain();
          \tif (unlikely(is_current_ksu_domain)) {
          \t\tif (!(flag & CL_COPY_MNT_NS)) {
          \t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);
          \t\t\tgoto bypass_orig_flow;
          \t\t}
          \t}
          \tif (likely(is_current_zygote_domain) && old->mnt.susfs_mnt_id_backup) {
          \t\tmnt = alloc_vfsmnt(old->mnt_devname, true, old->mnt.susfs_mnt_id_backup);
          \t\tgoto bypass_orig_flow;
          \t}
          \tmnt = alloc_vfsmnt(old->mnt_devname, false, 0);
          bypass_orig_flow:
          #else
          \tmnt = alloc_vfsmnt(old->mnt_devname);
          #endif"""

          code, n1 = re.subn(r'^[ \t]*mnt\s*=\s*alloc_vfsmnt\s*\(([^;]+)\)\s*;', repl_vfs, code, count=1, flags=re.M)
          code, n2 = re.subn(r'^[ \t]*mnt\s*=\s*alloc_vfsmnt\s*\(\s*old->mnt_devname\s*\)\s*;', new_clone, code, count=1, flags=re.M)
          assert n1 == 1 and n2 == 1, f"Failed: n1={n1}, n2={n2}"

          with open("fs/namespace.c", "w") as f:
              f.write(code)
          print("SUCCESS: fs/namespace.c SuSFS hooks applied cleanly!")
          EOF

          rm -f fs/namespace.c.rej fs/namespace.c.orig
          rm -rf susfs_repo

      - name: Select Defconfig & Apply Daily/Gaming Tuning
        working-directory: kernel
        run: |
          if [ -f "arch/arm64/configs/vendor/whyred-retrofit_defconfig" ]; then
            DEFCONFIG="vendor/whyred-retrofit_defconfig"
          elif [ -f "arch/arm64/configs/whyred-retrofit_defconfig" ]; then
            DEFCONFIG="whyred-retrofit_defconfig"
          elif [ -f "arch/arm64/configs/vendor/whyred-perf_defconfig" ]; then
            DEFCONFIG="vendor/whyred-perf_defconfig"
          else
            DEFCONFIG="whyred_defconfig"
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

          cat << 'EOF' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_NOMOUNT=y
          CONFIG_HZ_300=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF

      - name: Compile Kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="yhin-dev"
          export KBUILD_BUILD_HOST="Evolution-Build"

          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb

      - name: Setup AnyKernel3 & Package ZIP
        run: |
          IMAGE="kernel/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image.gz-dtb tidak ditemukan! Build gagal."
            exit 1
          fi

          GH="https://github.com"
          git clone --depth=1 "$GH/osm0sis/AnyKernel3.git" AnyKernel3
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Evolution-Kernel by yhin-dev
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          device.name2=Redmi Note 5
          device.name3=Redmi Note 5 Pro
          supported.versions=13 - 17
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp "$IMAGE" AnyKernel3/
          DATE=$(TZ=Asia/Jakarta date +"%Y%m%d")
          ZIP_NAME="Evolution-Kernel-whyred-4.19-A13-A17-${DATE}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
