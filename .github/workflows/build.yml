
name: Evolution Kernel - Source Inspection

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Base kernel branch"
        required: true
        default: "back-st21-layered-sched-stable"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect whyred Kernel Source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Base Kernel
        uses: actions/checkout@v4
        with:
          repository: user-why-red/android_kernel_xiaomi_sdm660_419
          ref: ${{ inputs.source_branch }}
          fetch-depth: 1
          path: kernel

      - name: Inspect Source
        shell: bash
        run: |
          cd kernel

          mkdir -p ../inspection

          {
            echo "================================"
            echo "       EVOLUTION KERNEL"
            echo "================================"
            echo ""
            echo "Device: whyred"
            echo "Architecture: ARM64"
            echo "Target: Linux 4.19"
            echo "Branch: ${{ inputs.source_branch }}"
            echo "Commit: $(git rev-parse HEAD)"
            echo ""

            echo "===== KERNEL VERSION ====="
            head -n 5 Makefile

            echo ""
            echo "===== WHYRED / SDM660 DEFCONFIG ====="
            find arch/arm64/configs -type f \
              \( -iname '*whyred*' -o -iname '*sdm660*' \) \
              | sort

            echo ""
            echo "===== AVAILABLE CLANG TOOLCHAINS ====="
            find . -maxdepth 5 -type f \
              \( -name clang -o -name clang++ \) \
              -print | head -n 50

            echo ""
            echo "===== AVAILABLE GCC TOOLCHAINS ====="
            find . -maxdepth 5 -type f \
              \( -name aarch64-linux-android-gcc \
              -o -name aarch64-linux-gnu-gcc \) \
              -print | head -n 30

            echo ""
            echo "===== BUILD CONFIGURATION ====="
            grep -nE 'ARCH[[:space:]]*[:?+]?=|CROSS_COMPILE|CLANG_TRIPLE|LLVM' Makefile \
              | head -n 50 || true

            echo ""
            echo "===== ANYKERNEL DIRECTORIES ====="
            find . -maxdepth 3 -type d \
              \( -iname '*anykernel*' \) -print

            echo ""
            echo "===== SOURCE INSPECTION COMPLETE ====="

          } | tee ../inspection/report.txt

      - name: Upload Inspection Report
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Kernel-Source-Report
          path: inspection/report.txt
          if-no-files-found: error
          retention-days: 7
